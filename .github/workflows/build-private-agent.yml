name: Build PrivateAgent 2 APK



on:

  workflow_dispatch:
  
  push:
  
    branches: [main]
    


permissions:

  contents: read
  


jobs:

  build:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Check out repository
      
        uses: actions/checkout@v4
        


      - name: Set up Java
      
        uses: actions/setup-java@v4
        
        with:
        
          distribution: temurin
          
          java-version: '17'
          


      - name: Set up Flutter
      
        uses: subosito/flutter-action@v2
        
        with:
        
          channel: stable
          
          cache: true
          


      - name: Unpack Flutter project
      
        run: unzip -q private-agent-main.zip -d source
        


      - name: Install dependencies
      
        working-directory: source/private-agent-main
        
        run: flutter pub get
        


      - name: Analyze Dart code (report only)
      
        working-directory: source/private-agent-main
        
        run: flutter analyze || true
        


      - name: Run tests
      
        working-directory: source/private-agent-main
        
        run: flutter test
        


      - name: Build APKs
      
        working-directory: source/private-agent-main
        
        run: |
        
          mkdir -p dist
          
          flutter build apk --release
          
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-universal-release.apk
          
          flutter build apk --release --split-per-abi
          
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/
          
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/
          
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/
          
          cd dist
          
          sha256sum *.apk > SHA256SUMS.txt
          


      - name: Upload APK artifacts
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: private-agent-2-apks
          
          path: source/private-agent-main/dist/*
          
          if-no-files-found: error
          
















































